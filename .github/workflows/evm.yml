name: EVM Matrix Farm
on:
  schedule:
    - cron: "0 */12 * * *"  # Runs automatically every 12 hours
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow the bot to save the wallets.json file
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install web3
      - name: Run EVM Bot
        run: python evm_bot.py
        env:
          EVM_PRIVATE_KEY: ${{ secrets.EVM_PRIVATE_KEY }}
      
      - name: Save Wallets File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallets.json
          git commit -m "Auto-save static wallets matrix" || echo "No wallets to save"
          git push
